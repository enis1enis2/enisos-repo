name: Build enisos-repo

on:
  push:
    paths:
      - "PKGBUILDs/**"
      - ".github/workflows/build-repo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # PKGBUILDs dizinlerini matrix listesine çevirir
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          cd PKGBUILDs
          dirs=$(find . -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -s -c .)
          echo "matrix=$dirs" >> "$GITHUB_OUTPUT"

  # Her paket ayrı job: archlinux:base-devel container'da makepkg
  build:
    needs: setup
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          useradd -m build
          chown -R build:build "$GITHUB_WORKSPACE"
          su build -c 'cd "$GITHUB_WORKSPACE/PKGBUILDs/${{ matrix.pkg }}" && makepkg -s --noconfirm'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg }}
          path: PKGBUILDs/${{ matrix.pkg }}/*.pkg.tar.zst
          if-no-files-found: error

  # Tüm paketleri topla, repo-add ile db oluştur, gh-pages'e push et
  repo:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm git
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
          merge-multiple: true
      - name: Create repository database
        run: |
          mkdir -p "$GITHUB_WORKSPACE/x86_64"
          find pkgs -name '*.pkg.tar.zst' -exec mv {} "$GITHUB_WORKSPACE/x86_64/" \;
          cd "$GITHUB_WORKSPACE/x86_64"
          repo-add enisrepo.db.tar.gz *.pkg.tar.zst
          ls -la
      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE/x86_64"
          PUB="$(mktemp -d)"
          git init "$PUB"
          git -C "$PUB" config user.name "github-actions[bot]"
          git -C "$PUB" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUB" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git -C "$PUB" ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git -C "$PUB" fetch --depth=1 origin gh-pages:refs/heads/gh-pages
            git -C "$PUB" checkout gh-pages
          else
            git -C "$PUB" checkout --orphan gh-pages
            git -C "$PUB" rm -rf . 2>/dev/null || true
          fi
          rm -rf "$PUB/x86_64"
          mkdir -p "$PUB/x86_64"
          cp -a "$SRC/." "$PUB/x86_64/"
          # GitHub Pages symlink servis etmez; repo-add'ın ürettiği
          # .db/.files symlink'lerini gerçek kopyaya çevir (gzip magic tanınır)
          for f in "$PUB/x86_64/enisrepo.db" "$PUB/x86_64/enisrepo.files"; do
            if [ -L "$f" ]; then
              rm "$f"
              cp "$f.tar.gz" "$f"
            fi
          done
          git -C "$PUB" add x86_64/
          if git -C "$PUB" diff --cached --quiet; then
            echo "Değişiklik yok, push atlanıyor"
          else
            git -C "$PUB" commit -m "Update repo [skip ci]"
            git -C "$PUB" push -f origin gh-pages
          fi
